name: home-inventory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: home-inventory-build
  cancel-in-progress: false

jobs:
  build:
    name: Build HomeInventory
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选 Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: 查看 Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate

      - name: 编译
        run: |
          set -o pipefail
          xcodebuild \
            -project HomeInventory.xcodeproj \
            -scheme HomeInventory \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: 打包 IPA
        run: |
          APP=$(find build -type d -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 .app 产物"; exit 1
          fi
          echo "产物: $APP"
          rm -rf Payload && mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr HomeInventory-unsigned.ipa Payload
          ls -lh HomeInventory-unsigned.ipa

      - name: 发布 IPA 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA=HomeInventory-unsigned.ipa
          RELEASE_TAG="unsigned-ipa"
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            --title "home-inventory" \
            --notes "自签版本" \
            "$IPA"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: HomeInventory-unsigned-ipa
          path: HomeInventory-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
