name: iOS Build & IPA (Xcode 26)

# 每次有新 commit（推送到 main）自动触发构建；也支持手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: home-inventory-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 选 Xcode 26.6（macos-26 镜像默认版，完整预装 iOS 26.5 SDK 与模拟器运行时）
      # 不要选 26.0.x：该镜像未安装对应的 iOS 26.0 平台，会导致找不到 destination
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # 设备归档（不签名，CODE_SIGNING_ALLOWED=NO）
      - name: Archive for device
        run: |
          xcodebuild archive \
            -project HomeInventory.xcodeproj \
            -scheme HomeInventory \
            -configuration Release \
            -archivePath build/HomeInventory.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      # 将归档内的 .app 手动打包成 .ipa（未签名，供 sideload/重签名使用）
      - name: Package IPA (unsigned)
        run: |
          set -e
          mkdir -p Payload
          cp -R build/HomeInventory.xcarchive/Products/Applications/HomeInventory.app Payload/
          zip -r -y HomeInventory.ipa Payload
          ls -lh HomeInventory.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeInventory-ipa
          path: HomeInventory.ipa
