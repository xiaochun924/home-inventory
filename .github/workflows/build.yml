name: iOS Build (Xcode 26)

# 每次有新 commit（推送到 main）自动触发构建；也支持手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: home-inventory-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 用官方 action 正确安装/选中 Xcode 26（避免 xcode-select 直接切路径的兼容问题）
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Show Xcode version
        run: xcodebuild -version

      # runner 上的 Xcode 26 可能未安装 iOS 平台，先补齐再构建
      - name: Install iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (simulator, no signing)
        run: |
          xcodebuild \
            -project HomeInventory.xcodeproj \
            -scheme HomeInventory \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
