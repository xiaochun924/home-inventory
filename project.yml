# XcodeGen 配置文件 —— 生成 HomeInventory.xcodeproj
# 用法：在工程根目录执行  xcodegen generate
# 若未安装 XcodeGen，也可手动在 Xcode 中新建同名工程并把 Sources 目录文件拖入

name: HomeInventory
options:
  bundleIdPrefix: com.xiaochun924
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

targets:
  HomeInventory:
    type: application
    platform: iOS
    sources:
      # 注意排除 Widget 目录：InventoryWidget.swift 的 @main WidgetBundle 只能属于 Widget 扩展，
      # 若编入 App target 会产生重复 @main 编译错误；Shared 目录两个 target 都要编
      - path: Sources
        excludes:
          - "Widget"
    # 嵌入小组件扩展：构建 App 时自动编译 Widget，并打包进 IPA 的 PlugIns/*.appex
    dependencies:
      - target: InventoryWidget
        embed: true
    entitlements:
      path: Sources/HomeInventory.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.xiaochun924.HomeInventory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaochun924.HomeInventory
        PRODUCT_NAME: HomeInventory
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  InventoryWidget:
    type: bundle.widget-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    entitlements:
      path: Sources/Widget/InventoryWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.xiaochun924.HomeInventory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaochun924.HomeInventory.Widget
        PRODUCT_NAME: HomeInventoryWidget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
